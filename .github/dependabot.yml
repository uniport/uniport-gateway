# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Group names double as auto-merge policy handles - see the 'merge_policy' input
# of uniport/workflows/.github/workflows/shared-dependabot-automerge.yml. Only
# 'build-tooling' and 'actions' are auto-merged; the rest batch PRs but stay manual.

version: 2

registries:
  # @see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#npm-registry
  inventage-maven:
    type: maven-repository
    url: https://nexus3.inventage.com/repository/inventage-portal-maven-group
    username: inventage-uniport-readonly
    password: ${{ secrets.NEXUS_NPM_PASSWORD_READ_ONLY }}
    replaces-base: true
  inventage-npm:
    type: npm-registry
    url: https://nexus3.inventage.com/repository/inventage-portal-npm-group
    username: inventage-uniport-readonly
    password: ${{secrets.NEXUS_NPM_PASSWORD_READ_ONLY}}
    replaces-base: true

updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - inventage-maven
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 30
    ignore:
      - dependency-name: "io.micrometer:micrometer-registry-prometheus" # required to be in sync with vertx-micrometer-metrics
    open-pull-requests-limit: 5
    labels:
      - "java"
      - "dependencies"
      - "no changelog"
    groups:
      build-tooling:
        patterns:
          - "org.apache.maven.plugins:*"
          - "com.puppycrawl.tools:checkstyle"
          - "com.diffplug.spotless:*"
          - "com.github.spotbugs:*"
          - "org.jacoco:*"
          - "org.cyclonedx:*"
          - "io.github.mfoo:libyear-maven-plugin"
          - "io.fabric8:docker-maven-plugin"
          - "io.kokuwa.maven:helm-maven-plugin"
          - "com.rudikershaw.gitbuildhook:git-build-hook-maven-plugin"
          - "com.github.eirslett:frontend-maven-plugin"
          - "org.codehaus.mojo:*"
        # Never auto-merge artifacts we build ourselves: Dependabot also resolves
        # against the staging Nexus repo and cannot tell an unreleased artifact from
        # a released one. These arrive as individual, human-reviewed PRs.
        exclude-patterns:
          - "com.inventage.*"
          - "ch.uniport.*"
      # The Vert.x stack moves as one: every artifact is aligned by
      # vertx-stack-depchain, which is what Dependabot actually bumps.
      vertx:
        patterns:
          - "io.vertx:*"
          - "io.reactiverse:*"
      # Same lockstep reason: the members are aligned by opentelemetry-bom.
      opentelemetry:
        patterns:
          - "io.opentelemetry:*"
          - "io.opentelemetry.*:*"
      test-dependencies:
        patterns:
          - "org.junit.jupiter:*"
          - "org.assertj:*"
          - "com.github.docker-java:*"

  - package-ecosystem: "npm"
    directory: "/docs/src/main/mkdocs"
    registries:
      - inventage-npm
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    labels:
      - "javascript"
      - "dependencies"
      - "no changelog"
    # This package builds the documentation and has devDependencies only, so it
    # gets one group rather than the fleet's frontend-runtime/frontend-tooling
    # split. Named for what it is: nothing here ships in the gateway.
    groups:
      docs-tooling:
        dependency-type: "development"
        update-types: ["patch", "minor"]
        # Internal packages are excluded and arrive as individual, human-reviewed
        # PRs: same staging-Nexus reason as the maven groups.
        exclude-patterns: ["@uniport/*", "@ips/*", "@inventage/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "no changelog"
    groups:
      actions:
        patterns: ["*"]
        # First-party actions track @main and are reviewed by a human if ever pinned
        exclude-patterns: ["uniport/*"]
