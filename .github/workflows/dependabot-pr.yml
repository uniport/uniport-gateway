# This workflow does have access to secrets and has a read-write token
# https://github.com/dependabot/dependabot-core/issues/3253#issuecomment-852541544
name: Dependabot PR Check

on:
  pull_request_target:

# Prevent running builds for the same branch in parallel
# New workflows will cancel existing workflows…
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (preview)
    # Run for Dependabot PRs, including follow-up fixes a human pushes onto the
    # Dependabot branch. Restricted to same-repo branches so fork PRs can never
    # build with secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
    uses: ./.github/workflows/build.yml
    secrets:
      NEXUS3_PW: ${{ secrets.NEXUS3_PW }}
      NEXUS_NPM_TOKEN_READ_ONLY: ${{ secrets.NEXUS_NPM_TOKEN_READ_ONLY }}
      MACDUFF_KEYCHAIN_PASSWORD: ${{ secrets.MACDUFF_KEYCHAIN_PASSWORD }}

  automerge:
    name: Auto-Merge
    needs: build # Only reached when the full build (incl. tests) passed
    # Actor gate (not branch gate): a human pushing a fix onto the Dependabot
    # branch changes the actor and permanently disarms auto-merge for that PR.
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: read # For the Dependabot metadata; the merge uses the Uniport App token
    uses: uniport/workflows/.github/workflows/shared-dependabot-automerge.yml@main
    with:
      # 'vertx', 'opentelemetry' and 'test-dependencies' are batched but stay
      # manual. 'docs-tooling' is a candidate to add once a cycle of grouped PRs
      # has been seen: the docs build already runs markdownlint, prettier and a
      # link check, so the check does exercise it.
      merge_policy: 'actions:minor,build-tooling:minor'
    secrets:
      UNIPORT_APP_PRIVATE_KEY: ${{ secrets.UNIPORT_APP_PRIVATE_KEY }}
